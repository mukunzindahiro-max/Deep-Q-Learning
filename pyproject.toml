[project]
name = "dqn-atari"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ale-py==0.11.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "gymnasium[atari]>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy<2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "opencv-python>=4.9",
    "torch==2.2.2 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "torch>=2.6 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]
